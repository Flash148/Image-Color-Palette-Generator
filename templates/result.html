<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🎨 Color Palette Extracted!</h1>
        
        <div class="uploaded-image">
            <img src="{{ url_for('static', filename='uploads/' + image_path.split('/')[-1]) }}" alt="Uploaded Image">
        </div>

        <h2>Dominant Colors</h2>
        
        <div class="color-grid">
            {% for color in colors %}
            <div class="color-card">
                <div class="color-swatch" style="background-color: {{ color.hex }};"></div>
                <div class="color-info">
                    <p class="hex-code">{{ color.hex }}</p>
                    <p class="rgb-code">RGB{{ color.rgb }}</p>
                    <p class="percentage">{{ "%.2f"|format(color.percentage) }}%</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <div style="text-align: center;">
            <a href="/" class="back-link">← Upload Another Image</a>
        </div>
    </div>
</body>
</html>
