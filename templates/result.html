<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🎨 Color Palette Extracted!</h1>
        
        <div class="uploaded-image">
            <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Uploaded Image">
        </div>

        <h2>Dominant Colors</h2>
        
        <div class="color-grid">
            {% for color in colors %}
            <div class="color-card">
                <div class="color-swatch" style="background-color: {{ color.hex }}"></div>
                <div class="color-info">
                    <p class="hex-code" onclick="copyToClipboard('{{ color.hex }}')">{{ color.hex }}
                    <span class="copy-hint"> Click to copy</span></p>
                    <p class="rgb-code">RGB{{ color.rgb }}</p>
                    <p class="percentage">{{ "%.2f"|format(color.percentage) }}%</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <div style="text-align: center;">
            <a href="/" class="back-link">← Upload Another Image</a>
        </div>
    </div>
    <script>
        function copyToClipboard(hexCode) {
            // copy to clipboard
            navigator.clipboard.writeText(hexCode).then(function() {
                //show success feedback
                showCopiedFeedback(hexCode);
            }).catch(function(err) {
                console.error('Could not copy text: ', err);
                alert('Copied: ' + hexCode);
            });
        }
        function showCopiedFeedback(hexCode) {
            // create feedback element
            const feedback = document.createElement('div');
            feedback.className = 'copy-feedback';
            feedback.textContent = `Copied ${hexCode}!`;

            //add to page
            document.body.appendChild(feedback);

            //remove after 2 seconds
            setTimeout(function() {
                document.body.removeChild(feedback);
            }, 2000);
        }
    </script>
</body>
</html>
